<div class="min-h-screen flex items-center justify-center bg-gray-100">

  <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-8">

    <div class="text-3xl font-bold text-[#07142f] mb-2">
      Iniciar Sesión
    </div>

    <div class="text-gray-500 mb-8">
      Accede a tu plataforma
    </div>

    <form
      (ngSubmit)="login()"
      class="space-y-5"
    >

      <div>

        <div class="mb-2 text-sm font-medium">
          Correo
        </div>

        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          class="w-full border border-gray-300 rounded-xl px-4 py-3"
        />

      </div>

      <div>

        <div class="mb-2 text-sm font-medium">
          Contraseña
        </div>

        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          class="w-full border border-gray-300 rounded-xl px-4 py-3"
        />

      </div>

      <button
        class="w-full bg-[#8d1d4f] text-white py-3 rounded-xl font-semibold"
      >
        Entrar
      </button>

    </form>

    <div
      *ngIf="error"
      class="mt-5 bg-red-100 text-red-600 p-3 rounded-xl"
    >
      {{ error }}
    </div>

  </div>

</div>
